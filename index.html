<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff1f6"><title>恋ラボ｜イベントカレンダー</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#493a47;background:#fff8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:20px 15px 70px}.hero{text-align:center;background:linear-gradient(135deg,#fff,#ffe6f0);border-radius:24px;padding:30px 12px;margin-bottom:20px;box-shadow:0 7px 25px #f4c6d438}.brand{font-size:12px;letter-spacing:5px;color:#c75c87}h1{font-size:26px;margin:8px 0;color:#a83e6c}.sub{font-size:13px;color:#947282}.panel{background:#fff;border:1px solid #f7d9e5;border-radius:22px;padding:18px;box-shadow:0 6px 24px #eab7c51c}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.month strong{font-size:19px;color:#9e3e69}button,.action{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 15px;background:#e77aa3;color:#fff;text-decoration:none;display:inline-block}button:disabled{opacity:.3;cursor:default}.nav{background:#fff1f6;color:#a44370}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#a68c99;font-size:12px;padding:8px 0}.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff;border-radius:12px;font-size:14px;color:#6e5d65;padding:0;min-height:38px}.day.event{background:#ffe4ef;color:#a23c69;font-weight:700;border:1px solid #f5bad0}.day.selected{background:#d95287;color:#fff}.dot{width:5px;height:5px;border-radius:50%;background:currentColor;margin-top:3px}.hint{text-align:center;color:#a48b98;font-size:12px;margin:17px 0}.details{margin-top:18px}.eventcard{border:1px solid #f7d8e4;border-radius:16px;padding:17px;margin:12px 0;background:#fffafd}.tag{font-size:11px;color:#b14e78;background:#ffe7f0;border-radius:20px;padding:5px 10px}.eventcard h3{font-size:17px;color:#8f345f;margin:13px 0}.info{font-size:13px;line-height:2;color:#67545f}.seats{display:flex;gap:10px;margin:12px 0}.seat{flex:1;text-align:center;background:#fff0f5;border-radius:12px;padding:10px;font-size:13px}.seat b{display:block;font-size:19px;color:#a6406d}.action{width:100%;text-align:center;font-weight:bold;margin-top:10px}.foot{text-align:center;font-size:12px;color:#a18b95;margin-top:22px}.empty{text-align:center;color:#9b8791;padding:25px 0}#notice{font-size:12px;color:#8f4563;margin-top:8px;text-align:center}
</style></head><body><main class="wrap"><header class="hero"><div class="brand">KOI LABO</div><h1>♡ 恋ラボ ♡</h1><div class="sub">イベントカレンダー｜素敵な出会いを見つけよう</div></header><section class="panel"><div class="month"><button class="nav" id="prev" aria-label="前の月">‹</button><strong id="month"></strong><button class="nav" id="next" aria-label="次の月">›</button></div><div class="calendar" id="calendar"></div><p class="hint">♡ ピンクの日付をタップすると詳細が見られます</p><div id="details" class="details"></div></section><p class="foot">恋ラボ｜岡山の恋活・婚活イベント<br>ご予約はLINEでスタッフが確認後に確定します。</p></main><script>
let events=[],settings={lineUrl:''},offset=0,selected=null;const today=new Date();today.setDate(1);const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function monthDate(){return new Date(today.getFullYear(),today.getMonth()+offset,1)}function render(){const date=monthDate(),y=date.getFullYear(),m=date.getMonth();$('month').textContent=`${y}年 ${m+1}月`;$('prev').disabled=offset===0;$('next').disabled=offset===2;let html=['日','月','火','水','木','金','土'].map(s=>`<div class="weekday">${s}</div>`).join('');for(let i=0;i<date.getDay();i++)html+='<div></div>';const n=new Date(y,m+1,0).getDate();for(let d=1;d<=n;d++){const day=iso(y,m,d),has=events.some(e=>e.date===day);html+=`<button class="day ${has?'event':''} ${selected===day?'selected':''}" data-date="${day}" ${has?'':'disabled'} aria-label="${d}日${has?' イベントあり':''}">${d}${has?'<span class="dot"></span>':''}</button>`}$('calendar').innerHTML=html;document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});const items=events.filter(e=>e.date===selected);$('details').innerHTML=items.length?items.map(e=>`<article class="eventcard"><span class="tag">恋ラボ EVENT</span><h3>${esc(e.title)}</h3><div class="info">📅 ${esc(e.date)} ${esc(e.start)}〜${esc(e.end)}<br>📍 ${esc(e.place)}<br>🎀 対象：${esc(e.age)}<br>💰 男性：${esc(e.malePrice)}円 ／ 女性：${esc(e.femalePrice)}円<br>${esc(e.description)}</div><div class="seats"><div class="seat">男性 残席<b>${esc(e.maleSeats)}</b></div><div class="seat">女性 残席<b>${esc(e.femaleSeats)}</b></div></div><button class="action" data-book="${esc(e.id)}">LINEで参加予約する ♡</button><div id="notice"></div></article>`).join(''):'<div class="empty">開催日を選んでください ♡</div>';document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>book(events.find(e=>e.id===b.dataset.book)))}async function book(e){const message=`恋ラボの参加予約を希望します。\nイベント：${e.title}\n開催日：${e.date}\n時間：${e.start}〜${e.end}\n名前：\n年齢：\n性別：\n※スタッフからの返信で予約確定となります。`;try{await navigator.clipboard.writeText(message);$('notice').textContent='予約内容をコピーしました。LINEのトークに貼り付けて送信してください。'}catch{$('notice').textContent='LINEのトークでイベント名・開催日・お名前・年齢・性別を送信してください。'}if(settings.lineUrl&&/^https:\/\//.test(settings.lineUrl)){setTimeout(()=>window.location.href=settings.lineUrl,500)}else{$('notice').textContent+=' ※管理者によるLINE URL設定がまだ必要です。'}}$('prev').onclick=()=>{offset--;selected=null;render()};$('next').onclick=()=>{offset++;selected=null;render()};fetch('./events.json?'+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{events=Array.isArray(data.events)?data.events:[];settings=data.settings||{};render()}).catch(()=>{$('details').innerHTML='<div class="empty">イベント情報を読み込めませんでした。</div>'});render();
</script></body></html>
